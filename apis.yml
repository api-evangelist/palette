name: Palette
description: 'Palette (Palette HQ) is a sales commission and incentive compensation management platform
  that automates the calculation, tracking, and payout of sales commissions in real time. It lets revenue
  operations and finance teams design complex commission plans, run scenario analysis and forecasting,
  give reps live visibility into earnings through performance dashboards, and keep audit trails for
  compliance. Palette connects to CRMs (Salesforce, HubSpot, Pipedrive, Close, Outreach, Bullhorn,
  Sellsy), billing systems (Stripe, Chargebee, QuickBooks, Xero, NetSuite, Pennylane), and data
  warehouses (Snowflake, BigQuery, Redshift) via one-click integrations rather than a public developer
  API. The company is SOC 2 Type II compliant and backed by Bain Capital Ventures.'
