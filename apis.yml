  reason: customer-only-docs
  detail: >-
    Palette's only documentation host, doc.palettehq.com, historically 302'd to
    https://app.palettehq.com/#/login — the reference required an active tenant — and it
    now returns CloudFront 502 "Failed to contact the origin" on every path, while the API
    host api.palettehq.com is a dangling CNAME to an NXDOMAIN Elastic Beanstalk
    environment, so the API that Palette monitors as a component on its own status page
    has no reachable reference at all.
