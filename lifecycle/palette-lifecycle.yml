  - host: blog.palettehq.com
    result: 200
    note: Webflow-hosted blog, live
  - host: doc.palettehq.com
    result: 502
    note: >-
      CloudFront "Failed to contact the origin" on every path. The Internet Archive shows
      this host historically answered 302 to
      https://app.palettehq.com/#/login?next=https%3A%2F%2Fdoc.palettehq.com%2F — the
      documentation was customer-only, behind the application login, before the origin
      went away.
  - host: app.palettehq.com
    result: dns-no-address
    note: >-
      CNAME to d15a3myzfri5d8.cloudfront.net; that distribution returns NOERROR with no
      A/AAAA record on 8.8.8.8, 1.1.1.1 and 9.9.9.9. Still linked as "Login" from the live
      homepage.
  - host: api.palettehq.com
    result: dns-nxdomain
    note: >-
      CNAME to production-api.eba-axpzms7n.eu-west-3.elasticbeanstalk.com, which is
      NXDOMAIN. The Elastic Beanstalk environment behind the API host no longer exists.
  - host: integrations.palettehq.com
    result: tls-handshake-failure
    note: >-
      nginx 301s HTTP to HTTPS, and HTTPS answers a TLSv1 internal-error alert for that
      SNI — no usable certificate is served.
  - host: trail.palettehq.com
    result: 200
    note: >-
      Not a Palette surface — serves the lemlist custom-domain confirmation page for
      outbound email tracking.
