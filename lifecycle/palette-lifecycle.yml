availability:
  checked: '2026-08-13'
  note: >-
    Recorded as observed, not as a judgement about the company. The marketing site and
    Google Workspace MX records are live and Y Combinator still lists Palette (S21, Paris)
    as active with 14 people, but every host that serves the product plane was unreachable
